# Builds RudeBoy-<version>.zip when a version tag (v0.1.0, v0.2.0, ...) is pushed, and
# publishes it to GitHub Releases. It also uploads to CurseForge, Wago and WoWInterface
# for each site whose token is set as a repository secret (see RELEASING.md); sites without
# a token are skipped.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      # CF_API_KEY is given only to the upload step below, not to the packager: the packager's
      # own CurseForge upload fails on this project ("Missing field metadata") for reasons its
      # log doesn't show, so the upload is done here with the same API and a visible payload.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run tests
        run: luajit tests/run.lua

      - name: Check the tag matches the addon version
        run: |
          toc=$(sed -n 's/^## Version: *//p' RudeBoy/RudeBoy.toc | tr -d '\r')
          if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
            echo "Tag is $GITHUB_REF_NAME but RudeBoy/RudeBoy.toc says version $toc. Bump the version first (RELEASING.md)."
            exit 1
          fi

      - name: Package and publish
        uses: BigWigsMods/packager@v2

      - name: Upload to CurseForge
        if: ${{ secrets.CF_API_KEY != '' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: "1709294"
        run: |
          set -e
          zip=$(ls .release/*.zip | grep -v -- '-nolib' | head -1)
          version=$(sed -n 's/^## Version: *//p' RudeBoy/RudeBoy.toc | tr -d '\r')
          echo "file: $zip, version $version"

          # the CurseForge id(s) for WoW Forever 1.60.1 (game version type 88568)
          versions=$(curl -sS -H "x-api-token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions)
          ids=$(echo "$versions" | jq -c '[.[] | select(.gameVersionTypeID == 88568 and .name == "1.60.1") | .id]')
          echo "game version ids: $ids"
          if [ "$ids" = "[]" ]; then
            echo "CurseForge has no WoW Forever 1.60.1 entry. Its WoW Forever versions:"
            echo "$versions" | jq -c '[.[] | select(.gameVersionTypeID == 88568) | .name]'
            exit 1
          fi

          # this version's section of the changelog
          changelog=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          jq -n --arg name "v$version" --argjson ids "$ids" --arg cl "$changelog" \
            '{displayName: $name, gameVersions: $ids, releaseType: "beta", changelog: $cl, changelogType: "markdown"}' > meta.json
          echo "metadata:"; cat meta.json

          code=$(curl -sS -w "%{http_code}" -o result.json -H "x-api-token: $CF_API_KEY" \
            -F "metadata=<meta.json" -F "file=@$zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file")
          echo "response $code:"; cat result.json; echo
          [ "$code" = "200" ]
